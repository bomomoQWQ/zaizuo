plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}
android {
    namespace 'dev.zaizuo.zaizuo_mobile_probe'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'dev.zaizuo.zaizuo_mobile_probe'
        minSdk 24
        targetSdk 34
        versionCode flutter.versionCode
        versionName flutter.versionName
        // Match the Flutter engine target, not every ABI in dependency AARs.
        ndk {
            abiFilters.clear()
            def requested = project.findProperty('target-platform') ?: 'android-arm64'
            def nativeAbis = ['android-arm': 'armeabi-v7a', 'android-arm64': 'arm64-v8a', 'android-x64': 'x86_64']
            requested.split(',').each { target ->
                if (!nativeAbis.containsKey(target)) throw new GradleException('Unsupported validation APK ABI')
                abiFilters.add(nativeAbis[target])
            }
        }
    }
    // Only debug/internal packaging; no release credentials or production key.
}
flutter {
    source '../..'
}
