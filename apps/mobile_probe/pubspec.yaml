name: zaizuo_mobile_probe
description: 在座简版聊天测试前端，保留图片与Git开发验证工具。
version: 0.1.0+4
publish_to: none

environment:
  sdk: '>=3.14.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  zaizuo_git_mobile:
    path: ../../packages/git_mobile
  zaizuo_core:
    path: ../../packages/core
  zaizuo_runtime:
    path: ../../packages/runtime
  zaizuo_domain:
    path: ../../packages/domain
  path_provider: 2.1.6
  path: ^1.9.1
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/probe.png
    - assets/licenses/AGPL-3.0-only.txt
    - assets/licenses/NOTICE.txt
    - assets/licenses/native_git/SOURCES.md
    - assets/licenses/native_git/native-manifest.json
    - assets/licenses/native_git/licenses/
